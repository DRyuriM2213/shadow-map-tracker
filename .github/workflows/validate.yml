name: Validate build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Capture typecheck
        shell: bash
        run: |
          set +e
          bunx tsc --noEmit > typecheck.txt 2>&1
          echo $? > typecheck-exit.txt
          exit 0
      - name: Capture build
        shell: bash
        run: |
          set +e
          bun run build > build.txt 2>&1
          echo $? > build-exit.txt
          exit 0
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            typecheck.txt
            typecheck-exit.txt
            build.txt
            build-exit.txt
      - name: Fail if validation failed
        shell: bash
        run: |
          test "$(cat typecheck-exit.txt)" = "0"
          test "$(cat build-exit.txt)" = "0"
