name: Integrar combate na ficha

on:
  push:
    paths:
      - '.github/workflows/automation-combat-integration.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Aplicar integração
        run: |
          python3 <<'PY'
          from pathlib import Path

          player = Path('src/routes/player.tsx')
          text = player.read_text()
          rules_import = 'import { SKILLS, TRAINING_BONUS, normalizeSheet, type CharacterSheetData, type OrdemAttribute } from "@/data/ordemRules";\n'
          combat_import = 'import { combatAttackById } from "@/data/combatRules";\n'
          if combat_import not in text:
              if rules_import not in text:
                  raise SystemExit('Import anchor not found in player.tsx')
              text = text.replace(rules_import, rules_import + combat_import, 1)
          old = 'const atk=sheet.attacks.find(a=>a.id===attackId);'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 legacy attack lookups, found {count}')
          text = text.replace(old, 'const atk=combatAttackById(sheet,attackId);')
          player.write_text(text)

          sheet = Path('src/components/player/CharacterSheetPanel.tsx')
          text = sheet.read_text()
          skill_import = 'import { SkillTrainingPanel } from "@/components/player/SkillTrainingPanel";\n'
          combat_panel_import = 'import { CombatPanel } from "@/components/player/CombatPanel";\n'
          if combat_panel_import not in text:
              if skill_import not in text:
                  raise SystemExit('SkillTrainingPanel import anchor not found')
              text = text.replace(skill_import, skill_import + combat_panel_import, 1)
          text = text.replace('gustify-center', 'justify-center')

          start = text.find('    {section === "Ataques" && <Panel title="Ataques">')
          end = text.find('    {section === "Poderes/Rituais"', start)
          if start < 0 or end < 0:
              raise SystemExit('Attack section anchors not found')

          replacement = '''    {section === "Ataques" && <div className="space-y-4">
      <CombatPanel sheet={sheet} onRollAttack={onRollAttack} onRollDamage={onRollDamage} onRollSkill={onRollSkill}/>
      <Panel title="Ataques manuais / homebrew">
        <p className="text-xs text-muted-foreground">Ataques criados manualmente continuam disponíveis no painel acima. Use esta área para editar homebrews, poderes especiais ou armas que o catálogo automático não reconhece.</p>
        <div className="space-y-3">{sheet.attacks.map((attack) => <div key={attack.id} className="rounded-xl border border-border p-3"><div className="flex flex-wrap items-center gap-2"><Input disabled={!editable} className="min-w-[160px] flex-1 font-semibold" value={attack.name} onChange={(event) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, name: event.target.value } : item))}/>{editable && <Button size="sm" variant="ghost" onClick={() => patch("attacks", sheet.attacks.filter((item) => item.id !== attack.id))}><Trash2 className="size-4"/></Button>}</div><div className="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-4"><SelectAttr value={attack.attribute} editable={editable} onChange={(value) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, attribute: value } : item))}/><TextField label="Perícia" value={attack.skillId} editable={editable} onChange={(value) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, skillId: value } : item))}/><NumField label="Bônus" value={attack.bonus} editable={editable} onChange={(value) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, bonus: value } : item))}/><TextField label="Dano" value={attack.damage} editable={editable} onChange={(value) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, damage: value } : item))}/><NumField label="Margem crítica" value={attack.criticalMargin} editable={editable} onChange={(value) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, criticalMargin: value } : item))}/><NumField label="Multiplicador" value={attack.criticalMultiplier} editable={editable} onChange={(value) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, criticalMultiplier: value } : item))}/><TextField label="Alcance" value={attack.range} editable={editable} onChange={(value) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, range: value } : item))}/><TextField label="Munição" value={attack.ammo} editable={editable} onChange={(value) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, ammo: value } : item))}/></div><LongField label="Especial / notas" value={attack.special} editable={editable} onChange={(value) => patch("attacks", sheet.attacks.map((item) => item.id === attack.id ? { ...item, special: value } : item))}/></div>)}{sheet.attacks.length === 0 && <Empty text="Nenhum ataque manual cadastrado. Ataque desarmado e armas equipadas reconhecidas continuam aparecendo automaticamente acima."/>}{editable && <Button variant="outline" onClick={() => patch("attacks", [...sheet.attacks, { id: uid("atk"), name: "Novo ataque", attribute: "FOR", skillId: "luta", bonus: 0, damage: "1d6", criticalMargin: 20, criticalMultiplier: 2, range: "", special: "", ammo: "" }])}><Plus className="mr-1 size-4"/>Adicionar ataque manual</Button>}</div>
      </Panel>
    </div>}

'''
          text = text[:start] + replacement + text[end:]
          sheet.write_text(text)
          PY
      - name: Instalar dependências
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Remover workflow temporário e salvar alterações
        run: |
          rm .github/workflows/automation-combat-integration.yml
          git config user.name "berco-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/player.tsx src/components/player/CharacterSheetPanel.tsx .github/workflows/automation-combat-integration.yml
          git diff --cached --check
          git commit -m "Integra combate automático à ficha do player"
          git push
