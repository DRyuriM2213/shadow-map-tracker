name: Ficha progression hardening

on:
  push:
    paths:
      - '.github/workflows/ficha-progression-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Harden player sheet autosave concurrency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/player.tsx')
          s = p.read_text()
          old = '''  const [dirty, setDirty] = useState(false);\n  const dirtyRef = useRef(false);\n  const refreshInFlight = useRef(false);'''
          new = '''  const [dirty, setDirty] = useState(false);\n  const dirtyRef = useRef(false);\n  // Sequência monotônica de edição/salvamento: uma resposta antiga nunca pode\n  // marcar como salva uma ficha que mudou enquanto a requisição estava em voo.\n  const editVersionRef = useRef(0);\n  const saveInFlightRef = useRef(0);\n  const refreshInFlight = useRef(false);'''
          if old not in s:
              raise SystemExit('anchor refs not found')
          s = s.replace(old, new, 1)
          old = '''  useEffect(()=>{\n    if(!dirty||preview||!data?.profile.canEditSheet)return;\n    const current=requirePlayerSession(); if(!current)return;\n    setSaveStatus("salvando…");\n    const t=window.setTimeout(()=>{void rpc<{ok:boolean;error?:string}>("player_save_sheet",{p_token:current.token,p_data:sheet}).then(r=>{if(!r.ok)throw new Error(r.error||"Falha ao salvar");setDirty(false);setSaveStatus("salvo no Cloud");}).catch(e=>setSaveStatus(`erro: ${e instanceof Error?e.message:"falha"}`));},750);\n    return()=>window.clearTimeout(t);\n  },[dirty,sheet,preview,data?.profile.canEditSheet]);'''
          new = '''  useEffect(()=>{\n    if(!dirty||preview||!data?.profile.canEditSheet)return;\n    const current=requirePlayerSession(); if(!current)return;\n    const scheduledVersion=editVersionRef.current;\n    setSaveStatus("salvando…");\n    const t=window.setTimeout(()=>{\n      const requestVersion=scheduledVersion;\n      saveInFlightRef.current=requestVersion;\n      void rpc<{ok:boolean;error?:string}>("player_save_sheet",{p_token:current.token,p_data:sheet}).then(r=>{\n        if(!r.ok)throw new Error(r.error||"Falha ao salvar");\n        // Só a versão ainda atual pode limpar o dirty. Se houve edição durante\n        // o save, mantemos as alterações locais e o próximo efeito salva de novo.\n        if(requestVersion===editVersionRef.current){\n          setDirty(false);\n          dirtyRef.current=false;\n          setSaveStatus("salvo no Cloud");\n        }else{\n          setSaveStatus("novas alterações pendentes");\n        }\n      }).catch(e=>{\n        if(requestVersion===editVersionRef.current)setSaveStatus(`erro: ${e instanceof Error?e.message:"falha"}`);\n      }).finally(()=>{\n        if(saveInFlightRef.current===requestVersion)saveInFlightRef.current=0;\n      });\n    },750);\n    return()=>window.clearTimeout(t);\n  },[dirty,sheet,preview,data?.profile.canEditSheet]);'''
          if old not in s:
              raise SystemExit('autosave anchor not found')
          s = s.replace(old, new, 1)
          old = '''  const updateSheet=(next:CharacterSheetData)=>{if(preview||!data?.profile.canEditSheet)return;setSheet(next);setDirty(true);setSaveStatus("alterações locais");};'''
          new = '''  const updateSheet=(next:CharacterSheetData)=>{if(preview||!data?.profile.canEditSheet)return;editVersionRef.current+=1;dirtyRef.current=true;setSheet(next);setDirty(true);setSaveStatus("alterações locais");};'''
          if old not in s:
              raise SystemExit('updateSheet anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit validated fix and remove temporary workflow
        run: |
          rm .github/workflows/ficha-progression-hardening.yml
          git config user.name 'Berco Mestre QA'
          git config user.email 'actions@users.noreply.github.com'
          git add src/routes/player.tsx .github/workflows/ficha-progression-hardening.yml
          git commit -m 'Protege autosave da ficha contra respostas antigas'
          git push origin HEAD:main